name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install nsh
        shell: pwsh
        env:
          NSH_VERSION: v0.6.1
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:LOCALAPPDATA\nsh\bin\nsh.exe" --version

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y

      - name: Package Windows installer
        shell: pwsh
        run: nsh package --target windows

      - name: Fetch and bundle pinned gozd.exe
        shell: pwsh
        run: |
          $stage = ".nsh/gozd-stage"
          ./scripts/fetch-gozd.ps1 -OutDir $stage -Force
          $gozd = Join-Path $stage "gozd.exe"

          Get-ChildItem ".nsh/out" -Directory | ForEach-Object {
            Copy-Item $gozd -Destination (Join-Path $_.FullName "gozd.exe") -Force
          }

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
          if (-not $iscc) {
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup 6 (ISCC.exe) not found; cannot rebuild setup installer with bundled gozd.exe"
          }

          Get-ChildItem ".nsh/out/*.iss" | ForEach-Object {
            $issContent = Get-Content $_.FullName -Raw
            if ($issContent -notmatch '(?m)^PrivilegesRequired=lowest\r?$') {
              throw "Expected PrivilegesRequired=lowest in $($_.FullName)"
            }
            if ($issContent -notmatch '(?m)^\[Run\]\r?$') {
              throw "Expected [Run] section in $($_.FullName)"
            }
            $issContent = $issContent -replace '(?m)^PrivilegesRequired=lowest\r?$', "PrivilegesRequired=admin"
            $serviceRunLine = 'Filename: "{app}\gozd.exe"; Parameters: "install"; Flags: runhidden waituntilterminated; StatusMsg: "Installing and starting goz indexing service..."'
            $issContent = $issContent -replace '(?m)^\[Run\]\r?$', "[Run]`r`n$serviceRunLine"
            Set-Content -Path $_.FullName -Value $issContent -Encoding UTF8

            & $iscc "/O.nsh/out" $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC.exe failed for $($_.FullName) with exit code $LASTEXITCODE"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Get-ChildItem ".nsh/out/*.zip" | ForEach-Object {
            $zip = [System.IO.Compression.ZipFile]::Open($_.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
            try {
              $exeEntry = $zip.Entries | Where-Object { $_.FullName -match '(^|/)Ramen\.exe$' } | Select-Object -First 1
              $targetEntry = if ($exeEntry -and $exeEntry.FullName.Contains('/')) {
                ($exeEntry.FullName.Substring(0, $exeEntry.FullName.LastIndexOf('/') + 1)) + "gozd.exe"
              } else {
                "gozd.exe"
              }
              $existing = $zip.GetEntry($targetEntry)
              if ($existing) { $existing.Delete() }
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $gozd, $targetEntry) | Out-Null
            } finally {
              $zip.Dispose()
            }
          }

          Copy-Item $gozd -Destination ".nsh/out/gozd.exe" -Force

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .nsh/out/*.exe
            .nsh/out/*.zip
          generate_release_notes: true
