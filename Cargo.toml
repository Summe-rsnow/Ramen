[package]
name = "nsh-app-ramen"
version = "1.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Summe-rsnow/Ramen"
publish = false

[workspace]

[dependencies]
nsh-core = { version = "0.7.1", features = ["svg"] }
nsh-base = { version = "0.7.1", default-features = false }
bento = { git = "https://github.com/Summe-rsnow/Bento.git", tag = "v1.2.0" }
goz-core = { git = "https://github.com/mustafaahci/goz.git", tag = "v0.7.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.13"
env_logger = "0.11"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.1", default-features = false, features = ["svg"] }
goz-winfs = { git = "https://github.com/mustafaahci/goz.git", tag = "v0.7.1" }

[dev-dependencies]
nsh-engine = "0.7.1"
nsh-testing = { version = "0.7.1", features = ["live"] }

