<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Squircle app container clip -->
    <clipPath id="tileClip">
      <rect x="64" y="64" width="896" height="896" rx="212"/>
    </clipPath>

    <!-- Top-down bowl & broth clips -->
    <clipPath id="bowlClip">
      <circle cx="512" cy="512" r="272"/>
    </clipPath>
    <clipPath id="brothClip">
      <circle cx="512" cy="512" r="224"/>
    </clipPath>
    <clipPath id="eggClip">
      <ellipse cx="0" cy="0" rx="68" ry="52"/>
    </clipPath>

    <!-- Deep obsidian tile canvas matching Bento/Wonton/Sundae family -->
    <linearGradient id="tileBg" x1="128" y1="72" x2="896" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="52%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#090c14"/>
    </linearGradient>

    <radialGradient id="topAura" cx="512" cy="370" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0e1320" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tileRim" x1="180" y1="64" x2="844" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Soft warm floor glow -->
    <radialGradient id="levitateGlow" cx="512" cy="828" r="218" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 745) scale(1 0.1)">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.46"/>
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Sculpted vermilion-amber outer ceramic bowl rim -->
    <linearGradient id="bowlRimGrad" x1="300" y1="260" x2="724" y2="764" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="36%" stop-color="#f97316"/>
      <stop offset="72%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <linearGradient id="bowlRimSpecular" x1="270" y1="280" x2="660" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.88"/>
      <stop offset="58%" stop-color="#fed7aa" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>

    <!-- Recessed ceramic inner step -->
    <linearGradient id="innerWallGrad" x1="320" y1="290" x2="704" y2="734" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="45%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Rich golden-amber tonkotsu/shoyu broth -->
    <radialGradient id="brothGrad" cx="484" cy="482" r="236" fx="472" fy="468" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="42%" stop-color="#d97706"/>
      <stop offset="78%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#5c2208"/>
    </radialGradient>

    <!-- Inner bowl wall ambient occlusion cast onto broth -->
    <radialGradient id="brothInnerAO" cx="530" cy="532" r="228" gradientUnits="userSpaceOnUse">
      <stop offset="74%" stop-color="#290d02" stop-opacity="0"/>
      <stop offset="100%" stop-color="#290d02" stop-opacity="0.56"/>
    </radialGradient>

    <!-- Roasted nori seaweed -->
    <linearGradient id="noriGrad" x1="510" y1="300" x2="710" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26473a"/>
      <stop offset="48%" stop-color="#112920"/>
      <stop offset="100%" stop-color="#07130e"/>
    </linearGradient>

    <!-- Golden ramen noodles -->
    <linearGradient id="noodleGrad" x1="324" y1="460" x2="610" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="48%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft-boiled egg (Ajitama) -->
    <linearGradient id="eggWhiteGrad" x1="-40" y1="-48" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="56%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="eggYolkGrad" cx="-2" cy="-6" r="36" fx="-6" fy="-10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="38%" stop-color="#fbbf24"/>
      <stop offset="76%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Narutomaki fishcake -->
    <radialGradient id="narutoGrad" cx="628" cy="496" r="64" fx="612" fy="478" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>

    <!-- Chopsticks -->
    <linearGradient id="chopstickGrad" x1="520" y1="316" x2="860" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="46%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <g clip-path="url(#tileClip)">
    <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#tileBg)"/>
    <circle cx="512" cy="370" r="430" fill="url(#topAura)"/>
  </g>
  <rect x="65" y="65" width="894" height="894" rx="211" fill="none" stroke="url(#tileRim)" stroke-width="2.5"/>

  <!-- Soft floor glow -->
  <ellipse cx="512" cy="828" rx="206" ry="20" fill="url(#levitateGlow)"/>

  <!-- Outer sculpted vermilion ceramic bowl (top-down) -->
  <circle cx="512" cy="512" r="272" fill="url(#bowlRimGrad)"/>
  <g clip-path="url(#bowlClip)">
    <path d="M 262 414 A 268 268 0 0 1 704 322" fill="none" stroke="url(#bowlRimSpecular)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Recessed ceramic lip -->
  <circle cx="512" cy="512" r="236" fill="url(#innerWallGrad)"/>

  <!-- Golden-amber broth pool -->
  <circle cx="512" cy="512" r="224" fill="url(#brothGrad)"/>

  <!-- Top-down Ramen contents clipped to broth -->
  <g clip-path="url(#brothClip)">
    <!-- Broth inner wall AO -->
    <circle cx="512" cy="512" r="224" fill="url(#brothInnerAO)"/>

    <!-- Subtle warm broth oil droplets -->
    <circle cx="348" cy="458" r="11" fill="#fef3c7" fill-opacity="0.24"/>
    <circle cx="678" cy="598" r="11" fill="#fef3c7" fill-opacity="0.20"/>
    <circle cx="496" cy="336" r="9" fill="#fef3c7" fill-opacity="0.22"/>

    <!-- Roasted Nori Seaweed sheets tucked in upper-right -->
    <g transform="translate(612 372) rotate(24)">
      <rect x="-78" y="-50" width="156" height="104" rx="16" fill="#2a0f04" fill-opacity="0.34" transform="translate(0 8)"/>
      <rect x="-78" y="-50" width="156" height="104" rx="16" fill="url(#noriGrad)"/>
      <path d="M -68 -46 L 68 -46" stroke="#6ee7b7" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(556 334) rotate(8)">
      <rect x="-70" y="-44" width="140" height="88" rx="15" fill="#2a0f04" fill-opacity="0.34" transform="translate(0 8)"/>
      <rect x="-70" y="-44" width="140" height="88" rx="15" fill="url(#noriGrad)"/>
      <path d="M -60 -40 L 60 -40" stroke="#6ee7b7" stroke-opacity="0.30" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Rhythmic golden ramen noodle ribbons (tucked cleanly inside broth with zero edge clipping) -->
    <!-- Shadow pass -->
    <g fill="none" stroke="#451a03" stroke-opacity="0.36" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 8)">
      <path d="M 328 504 C 370 468, 412 538, 460 502 C 508 466, 548 536, 594 504" stroke-width="31"/>
      <path d="M 332 560 C 376 524, 420 596, 468 560 C 516 524, 558 594, 602 562" stroke-width="31"/>
      <path d="M 358 616 C 402 582, 444 652, 492 618 C 538 586, 576 646, 612 620" stroke-width="29"/>
      <path d="M 410 670 C 452 646, 492 694, 538 670" stroke-width="26"/>
    </g>
    <!-- Golden noodle pass -->
    <g fill="none" stroke="url(#noodleGrad)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 328 504 C 370 468, 412 538, 460 502 C 508 466, 548 536, 594 504" stroke-width="25"/>
      <path d="M 332 560 C 376 524, 420 596, 468 560 C 516 524, 558 594, 602 562" stroke-width="25"/>
      <path d="M 358 616 C 402 582, 444 652, 492 618 C 538 586, 576 646, 612 620" stroke-width="23"/>
      <path d="M 410 670 C 452 646, 492 694, 538 670" stroke-width="21"/>
    </g>
    <!-- Crisp cream specular top highlights along noodle curves -->
    <g fill="none" stroke="#fffbeb" stroke-opacity="0.65" stroke-linecap="round" transform="translate(0 -5)">
      <path d="M 332 503 C 372 470, 414 535, 460 502 C 506 469, 544 533, 588 504" stroke-width="5.5"/>
      <path d="M 336 559 C 378 526, 422 593, 468 560 C 514 527, 554 591, 596 562" stroke-width="5.5"/>
      <path d="M 362 615 C 404 584, 446 649, 492 618 C 536 588, 572 643, 606 620" stroke-width="5"/>
    </g>

    <!-- Ajitama soft-boiled half egg in upper-left -->
    <g transform="translate(412 396) rotate(-22)">
      <ellipse cx="2" cy="10" rx="70" ry="54" fill="#3b1305" fill-opacity="0.38"/>
      <ellipse cx="0" cy="0" rx="68" ry="52" fill="url(#eggWhiteGrad)"/>
      <g clip-path="url(#eggClip)">
        <path d="M -52 -24 A 66 50 0 0 1 50 -24" fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="5" stroke-linecap="round"/>
      </g>
      <circle cx="6" cy="4" r="33" fill="#431407" fill-opacity="0.16"/>
      <circle cx="4" cy="2" r="32" fill="url(#eggYolkGrad)"/>
      <ellipse cx="-6" cy="-10" rx="11" ry="5.5" transform="rotate(-24 -6 -10)" fill="#ffffff" fill-opacity="0.72"/>
    </g>

    <!-- Narutomaki fishcake in right quadrant -->
    <circle cx="630" cy="505" r="64" fill="#3b1305" fill-opacity="0.36"/>
    <circle cx="628" cy="496" r="62" fill="url(#narutoGrad)"/>
    <path d="M 580 460 A 58 58 0 0 1 674 458" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 628 496 C 628 481, 646 481, 646 496 C 646 516, 612 518, 610 494 C 608 466, 654 462, 662 496"
          fill="none" stroke="#f43f5e" stroke-width="11" stroke-linecap="round"/>

    <!-- Fresh green scallion rings (Negi) -->
    <g>
      <circle cx="536" cy="616" r="19" fill="#3b1305" fill-opacity="0.28" transform="translate(0 4)"/>
      <circle cx="536" cy="616" r="18" fill="#166534" fill-opacity="0.35" stroke="#4ade80" stroke-width="10"/>
      <circle cx="536" cy="616" r="18" fill="none" stroke="#bbf7d0" stroke-opacity="0.55" stroke-width="2.5"/>

      <circle cx="600" cy="638" r="16" fill="#3b1305" fill-opacity="0.28" transform="translate(0 4)"/>
      <circle cx="600" cy="638" r="15" fill="#166534" fill-opacity="0.35" stroke="#22c55e" stroke-width="9"/>
      <circle cx="600" cy="638" r="15" fill="none" stroke="#bbf7d0" stroke-opacity="0.5" stroke-width="2"/>

      <circle cx="468" cy="648" r="15" fill="#3b1305" fill-opacity="0.28" transform="translate(0 4)"/>
      <circle cx="468" cy="648" r="14" fill="#166534" fill-opacity="0.35" stroke="#4ade80" stroke-width="8.5"/>
    </g>
  </g>

  <!-- Crisp inner bowl rim accent ring -->
  <circle cx="512" cy="512" r="224" fill="none" stroke="#fde68a" stroke-opacity="0.36" stroke-width="3.5"/>

  <!-- Sleek tapered chopsticks resting along the upper-right rim -->
  <!-- Subtle shadow on rim -->
  <path d="M 556 304 L 832 192 C 844 187, 854 202, 842 211 L 566 322 C 556 326, 548 310, 556 304 Z"
        fill="#1e0902" fill-opacity="0.34" transform="translate(0 10)"/>
  <path d="M 580 342 L 854 256 C 867 252, 874 268, 862 276 L 588 358 C 578 361, 572 346, 580 342 Z"
        fill="#1e0902" fill-opacity="0.34" transform="translate(0 10)"/>

  <!-- Chopsticks bodies -->
  <path d="M 556 304 L 832 192 C 844 187, 854 202, 842 211 L 566 322 C 556 326, 548 310, 556 304 Z"
        fill="url(#chopstickGrad)"/>
  <path d="M 564 304 L 834 196" fill="none" stroke="#fffbeb" stroke-opacity="0.72" stroke-width="3.5" stroke-linecap="round"/>

  <path d="M 580 342 L 854 256 C 867 252, 874 268, 862 276 L 588 358 C 578 361, 572 346, 580 342 Z"
        fill="url(#chopstickGrad)"/>
  <path d="M 588 342 L 856 260" fill="none" stroke="#fffbeb" stroke-opacity="0.68" stroke-width="3.5" stroke-linecap="round"/>
</svg>
