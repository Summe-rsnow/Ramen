<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 160 692 692" width="24" height="24">
  <defs>
    <clipPath id="bmBowlClip">
      <circle cx="512" cy="512" r="272"/>
    </clipPath>
    <clipPath id="bmBrothClip">
      <circle cx="512" cy="512" r="224"/>
    </clipPath>
    <clipPath id="bmEggClip">
      <ellipse cx="0" cy="0" rx="68" ry="52"/>
    </clipPath>

    <!-- High-contrast saturated gradients readable on both light and dark title bars -->
    <linearGradient id="bmBowlRimGrad" x1="300" y1="260" x2="724" y2="764" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="44%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="bmInnerWallGrad" x1="320" y1="290" x2="704" y2="734" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <radialGradient id="bmBrothGrad" cx="484" cy="482" r="236" fx="472" fy="468" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="46%" stop-color="#d97706"/>
      <stop offset="86%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#5c2208"/>
    </radialGradient>

    <linearGradient id="bmNoriGrad" x1="510" y1="300" x2="710" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26473a"/>
      <stop offset="100%" stop-color="#07130e"/>
    </linearGradient>

    <linearGradient id="bmNoodleGrad" x1="324" y1="460" x2="610" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="bmEggWhiteGrad" x1="-40" y1="-48" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <radialGradient id="bmEggYolkGrad" cx="-2" cy="-6" r="36" fx="-6" fy="-10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="42%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>

    <linearGradient id="bmChopstickGrad" x1="520" y1="316" x2="860" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Outer sculpted bowl (top-down) -->
  <circle cx="512" cy="512" r="272" fill="url(#bmBowlRimGrad)"/>
  <circle cx="512" cy="512" r="236" fill="url(#bmInnerWallGrad)"/>
  <circle cx="512" cy="512" r="224" fill="url(#bmBrothGrad)"/>

  <g clip-path="url(#bmBrothClip)">
    <!-- Roasted Nori Seaweed -->
    <g transform="translate(612 372) rotate(24)">
      <rect x="-78" y="-50" width="156" height="104" rx="16" fill="url(#bmNoriGrad)"/>
    </g>
    <g transform="translate(556 334) rotate(8)">
      <rect x="-70" y="-44" width="140" height="88" rx="15" fill="url(#bmNoriGrad)"/>
    </g>

    <!-- Rhythmic golden ramen noodles -->
    <g fill="none" stroke="url(#bmNoodleGrad)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 328 504 C 370 468, 412 538, 460 502 C 508 466, 548 536, 594 504" stroke-width="27"/>
      <path d="M 332 560 C 376 524, 420 596, 468 560 C 516 524, 558 594, 602 562" stroke-width="27"/>
      <path d="M 358 616 C 402 582, 444 652, 492 618 C 538 586, 576 646, 612 620" stroke-width="25"/>
    </g>

    <!-- Ajitama soft-boiled half egg -->
    <g transform="translate(412 396) rotate(-22)">
      <ellipse cx="0" cy="0" rx="68" ry="52" fill="url(#bmEggWhiteGrad)"/>
      <circle cx="4" cy="2" r="32" fill="url(#bmEggYolkGrad)"/>
    </g>

    <!-- Narutomaki fishcake -->
    <circle cx="628" cy="496" r="62" fill="#fff1f2"/>
    <path d="M 628 496 C 628 481, 646 481, 646 496 C 646 516, 612 518, 610 494 C 608 466, 654 462, 662 496"
          fill="none" stroke="#f43f5e" stroke-width="12" stroke-linecap="round"/>

    <!-- Green scallion rings -->
    <circle cx="536" cy="616" r="18" fill="#166534" fill-opacity="0.35" stroke="#4ade80" stroke-width="11"/>
    <circle cx="600" cy="638" r="15" fill="#166534" fill-opacity="0.35" stroke="#22c55e" stroke-width="10"/>
    <circle cx="468" cy="648" r="14" fill="#166534" fill-opacity="0.35" stroke="#4ade80" stroke-width="9"/>
  </g>

  <!-- Chopsticks resting along upper-right rim -->
  <path d="M 556 304 L 832 192 C 844 187, 854 202, 842 211 L 566 322 C 556 326, 548 310, 556 304 Z"
        fill="url(#bmChopstickGrad)"/>
  <path d="M 580 342 L 854 256 C 867 252, 874 268, 862 276 L 588 358 C 578 361, 572 346, 580 342 Z"
        fill="url(#bmChopstickGrad)"/>
</svg>
